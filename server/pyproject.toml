[project]
name = "pipecat-client-server-example"
version = "0.1.0"
description = "Client/server web example using Pipecat"
requires-python = ">=3.12"
dependencies = [
    "pipecat-ai[webrtc,silero,deepgram,openai,cartesia,runner,google]>=1.16.0,<2.0.0",
    "av>=19.0.2,<20.0.0",
]

[dependency-groups]
dev = [
    "ruff~=0.12.1",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I"]
